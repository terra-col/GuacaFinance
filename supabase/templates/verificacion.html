<!-- Asunto: Tu código de verificación de Guaca -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Tu código de verificación de Guaca</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#f4f2ff;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Tu código para confirmar que eres tú.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f2ff" style="background:#f4f2ff;background-image:linear-gradient(160deg,#e9e3ff 0%,#f4f2ff 45%,#fcf0f6 100%);">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:520px;background:#ffffff;border:1px solid #e2def5;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(30,20,90,0.35);">
          <tr>
            <td style="padding:0;line-height:0;">
              <img src="{{ .SiteURL }}/email/encabezado.png" width="520" alt="Guaca" style="display:block;width:100%;max-width:520px;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:36px 36px 0;font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;">
              <p style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#6d4aff;">Verificación</p>
              <h1 style="margin:0 0 14px;font-family:Outfit,'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;line-height:1.15;color:#14112e;">Confirma que eres tú</h1>
              <p style="margin:0;font-size:16px;line-height:1.6;color:#4a4670;">Escribe este código en Guaca para continuar:</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 36px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius:20px;background:#f1edff;border:1px solid #e2def5;padding:18px 20px 18px 30px;font-family:Outfit,'Segoe UI',Helvetica,Arial,sans-serif;font-size:36px;font-weight:700;letter-spacing:10px;color:#6d4aff;">{{ .Token }}</td>
              </tr>
            </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 36px 36px;font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#68648c;">Si no lo pediste, ignora este correo y considera cambiar tu contraseña.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 36px;background:#f8f6ff;border-top:1px solid #ece8fb;font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#8a86ad;"><strong style="color:#6d4aff;">Guaca</strong> &middot; Tu plata, clara y en movimiento.<br>Este correo se envió a {{ .Email }}.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
